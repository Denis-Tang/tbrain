<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tbrain</title>
  <script>const appearance=localStorage.getItem('appearance')||'system';document.documentElement.dataset.theme=appearance==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):appearance;</script>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="titlebar"><div class="brand"><img src="icon.svg" alt="Tbrain" draggable="false"></div><div class="window-actions"><button type="button" data-window="minimize" aria-label="最小化">−</button><button type="button" data-window="maximize" aria-label="最大化或还原">□</button><button type="button" data-window="close" aria-label="关闭到托盘">×</button></div></div>

<div class="shell">
  <aside>
    <nav aria-label="主导航">
      <button type="button" class="nav-item active" data-page="overview" aria-label="总观" title="总观"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2.5"/><rect x="14" y="3" width="7" height="7" rx="2.5"/><rect x="3" y="14" width="7" height="7" rx="2.5"/><rect x="14" y="14" width="7" height="7" rx="2.5"/></svg></span><span class="nav-label">总观</span></button>
      <button type="button" class="nav-item" data-page="projects" aria-label="项目配置" title="项目配置"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a3 3 0 0 1 3-3h3l3 3h6a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3Z"/><path d="M8 12h8M8 16h5"/></svg></span><span class="nav-label">项目配置</span></button>
      <button type="button" class="nav-item" data-page="agents" aria-label="Agent 管理" title="Agent 管理"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M8 12v2m8-2v2M8 17h8"/></svg></span><span class="nav-label">Agent</span></button>
      <button type="button" class="nav-item" data-page="settings" aria-label="设置" title="设置"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4m6 0h8M3 17h8m6 0h4"/><circle cx="10" cy="7" r="3"/><circle cx="14" cy="17" r="3"/></svg></span><span class="nav-label">设置</span></button>
    </nav>
    <div class="foot">
      <button type="button" class="foot-version" id="app-version" title="设置">v—</button>
      <div class="foot-status"><span class="status-dot" id="ready-dot" aria-hidden="true"></span><span id="ready-label">未连接</span></div>
    </div>
  </aside>

  <main tabindex="0" aria-label="页面内容">
    <header><h1 id="page-title">总观</h1></header>

    <section id="setup" class="page" aria-label="首次设置">
      <form id="setup-form" class="card setup-card">
        <div class="card-heading"><h2>开始使用 Tbrain</h2></div>
        <label for="setup-vault">知识库文件夹</label>
        <div class="input-row"><input id="setup-vault" required autocomplete="off" spellcheck="false"><button type="button" class="button secondary" id="setup-browse">选择</button></div>
        <div class="section-heading setup-heading"><h2>接入 Agent</h2><button type="button" class="button quiet small" id="setup-refresh">刷新</button></div>
        <div id="setup-hosts" class="setup-hosts"></div>
        <p class="field-empty" id="setup-install-path"></p>
        <div class="form-actions"><button type="submit" class="button primary" id="setup-submit">开始使用</button></div>
      </form>
      <article id="setup-result" class="card" hidden>
        <div class="card-heading"><h2>安装完成</h2></div>
        <div id="setup-results" class="host-list" aria-live="polite"></div>
        <div class="form-actions"><button type="button" class="button primary" id="setup-finish">进入总观</button></div>
      </article>
    </section>

    <section id="overview" class="page active" aria-label="总观">
      <section class="card prompt-card" id="prompt-card" aria-label="全局提示词">
        <button type="button" class="prompt-toggle" id="toggle-prompt" aria-expanded="false" aria-controls="prompt-body">
          <h2>全局提示词</h2>
          <span class="chevron" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></span>
        </button>
        <div class="prompt-body" id="prompt-body" inert>
          <div class="prompt-inner"><div class="prompt-content">
            <textarea id="global-prompt" rows="4" aria-label="全局提示词" spellcheck="false"></textarea>
            <div class="prompt-actions"><span class="save-hint" id="prompt-saved" aria-live="polite"></span><button type="button" class="button primary" id="save-prompt">保存</button></div>
          </div></div>
        </div>
      </section>

      <div class="toolbar">
        <details class="status-menu" id="status-menu">
          <summary class="filter-toggle"><span id="filter-label">全部</span><span class="chevron" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></span></summary>
          <div class="filter-options" id="status-filters" role="group" aria-label="状态筛选">
            <button type="button" class="filter-option active" data-filter="全部" aria-label="全部" aria-pressed="true"><span>全部</span><span class="filter-count"></span><span class="filter-check" aria-hidden="true">✓</span></button>
            <button type="button" class="filter-option" data-filter="进行中" aria-label="进行中" aria-pressed="false"><span>进行中</span><span class="filter-count"></span><span class="filter-check" aria-hidden="true">✓</span></button>
            <button type="button" class="filter-option" data-filter="受阻" aria-label="受阻" aria-pressed="false"><span>受阻</span><span class="filter-count"></span><span class="filter-check" aria-hidden="true">✓</span></button>
            <button type="button" class="filter-option" data-filter="待验证" aria-label="待验证" aria-pressed="false"><span>待验证</span><span class="filter-count"></span><span class="filter-check" aria-hidden="true">✓</span></button>
            <button type="button" class="filter-option" data-filter="已完成" aria-label="已完成" aria-pressed="false"><span>已完成</span><span class="filter-count"></span><span class="filter-check" aria-hidden="true">✓</span></button>
            <button type="button" class="filter-option" data-filter="已放弃" aria-label="已放弃" aria-pressed="false"><span>已放弃</span><span class="filter-count"></span><span class="filter-check" aria-hidden="true">✓</span></button>
            <button type="button" class="filter-option" data-filter="已中断" aria-label="已中断" aria-pressed="false"><span>已中断</span><span class="filter-count"></span><span class="filter-check" aria-hidden="true">✓</span></button>
          </div>
        </details>
        <div class="toolbar-side"><span class="count" id="session-count"></span><button type="button" class="button secondary" id="refresh-sessions">刷新</button></div>
      </div>

      <div id="session-list" class="session-list" aria-live="polite"><div class="empty-state">正在读取</div></div>
    </section>

    <section id="projects" class="page" aria-label="项目配置">
      <div class="toolbar">
        <h2 id="project-count">全部项目</h2>
        <div class="toolbar-side"><button type="button" class="button secondary" id="projects-view-toggle">详细</button><button type="button" class="button secondary" id="refresh-projects">刷新</button><button type="button" class="button primary" id="new-project">新增项目</button></div>
      </div>
      <div id="project-list" class="root-list" aria-live="polite"><div class="empty-state">正在读取</div></div>
    </section>

    <section id="settings" class="page" aria-label="设置">
      <article class="card" id="install-card" hidden>
        <div class="update-row"><h2>安装到此电脑</h2><button type="button" class="button primary" id="open-setup">完成安装</button></div>
      </article>
      <article class="card">
        <div class="card-heading"><h2>外观</h2></div>
        <div class="segmented" id="appearance" role="group" aria-label="外观">
          <button type="button" data-appearance="system" aria-pressed="true">跟随系统</button>
          <button type="button" data-appearance="light" aria-pressed="false">浅色</button>
          <button type="button" data-appearance="dark" aria-pressed="false">深色</button>
        </div>
      </article>

      <form class="settings-form" id="settings-form">
        <article class="card">
          <div class="card-heading"><h2>知识库</h2></div>
          <label for="vault-path">路径</label>
          <div class="input-row"><input id="vault-path" autocomplete="off" spellcheck="false"><button type="button" class="button secondary" id="choose-vault">选择</button></div>
          <div class="form-actions"><button type="submit" class="button primary" id="save-settings">保存</button></div>
        </article>

        <article class="card">
          <div class="card-heading"><h2>时间与提醒</h2></div>
          <div class="field-grid">
            <div class="field"><label for="timezone">时区</label><select id="timezone"></select></div>
            <div class="field"><label for="timeout-hours">超时兜底</label><div class="number-row"><input id="timeout-hours" type="number" min="1" max="720" step="1"><span class="unit">小时</span></div></div>
          </div>
          <div class="switch-row"><div class="switch-text"><h3>联网校时</h3></div><label class="switch"><input type="checkbox" id="ntp-enabled" aria-label="联网校时"><span></span></label></div>
          <div class="switch-row"><div class="switch-text"><h3>换会话提醒</h3></div><label class="switch"><input type="checkbox" id="reminder-context-switch" aria-label="换会话提醒"><span></span></label></div>
          <div class="form-actions"><button type="submit" class="button primary">保存</button></div>
        </article>
      </form>

      <article class="card">
        <div class="card-heading"><h2>版本</h2><span class="version-pill" id="version-value">v—</span></div>
        <div class="update-row">
          <p class="update-status" id="update-status"></p>
          <div class="row-actions"><button type="button" class="button secondary" id="check-update">检查更新</button><button type="button" class="button secondary" id="apply-update">升级</button></div>
        </div>
      </article>


    </section>
    <section id="agents" class="page" aria-label="Agent 管理">
      <div class="agents-heading"><div><h2>接入你的 Agent</h2><p class="page-subtitle">统一管理 Tbrain 工具与生命周期 Hook</p></div><button type="button" class="button secondary" id="refresh-doctor">刷新状态</button></div>
      <div id="host-list" class="agent-list" aria-live="polite"></div>
      <p class="agent-note">开启后按各 Agent 的提示重开或重连。关闭后停止 Tbrain 工具与记录，缓存的工具列表在重开后移除。</p>
      <p class="agent-runtime" id="agent-runtime"></p>
    </section>
  </main>
</div>

<div class="drawer-scrim" id="drawer-scrim"></div>
<aside class="drawer" id="session-drawer" aria-label="会话详情" aria-hidden="true" inert>
  <div class="drawer-head">
    <div class="drawer-title"><span class="status-chip" id="detail-status"></span><h2 id="detail-name"></h2></div>
    <button type="button" class="icon-button" id="close-drawer" aria-label="关闭">×</button>
  </div>
  <p class="drawer-meta" id="detail-meta"></p>
  <div class="drawer-actions">
    <button type="button" class="button secondary" id="rename-session">重命名</button>
    <button type="button" class="button secondary" id="open-session-file">打开文件</button>
  </div>
  <div class="rename-row" id="rename-row" hidden>
    <input id="rename-input" maxlength="100" aria-label="新名称" autocomplete="off" spellcheck="false">
    <button type="button" class="button primary" id="rename-save">保存</button>
    <button type="button" class="button quiet" id="rename-cancel">取消</button>
  </div>
  <div class="markdown" id="detail-body"></div>
</aside>

<dialog id="project-dialog" aria-labelledby="project-dialog-title">
  <form id="project-form">
    <h2 id="project-dialog-title">新增项目</h2>
    <p id="project-parent-label" class="hint" hidden></p>
    <label for="project-name">名称</label>
    <input id="project-name" maxlength="100" autocomplete="off" spellcheck="false">
    <label>关联工作目录</label>
    <div id="project-paths" class="path-editor"></div>
    <div class="path-actions"><button type="button" class="button quiet" id="add-project-path">添加路径</button><button type="button" class="button quiet" id="browse-project-path">添加文件夹</button></div>
    <div class="switch-row"><div class="switch-text"><h3>允许读取子项目</h3></div><label class="switch"><input type="checkbox" id="project-allow-child" aria-label="允许读取子项目"><span></span></label></div>
    <div class="form-actions"><button type="button" class="button secondary" id="cancel-project">取消</button><button type="submit" class="button primary" id="save-project">创建项目</button></div>
  </form>
</dialog>

<dialog id="delete-dialog" aria-labelledby="delete-title">
  <h2 id="delete-title">删除项目</h2>
  <p id="delete-question"></p>
  <div class="form-actions"><button type="button" class="button secondary" id="cancel-delete">取消</button><button type="button" class="button danger" id="confirm-delete">删除</button></div>
</dialog>

<dialog id="tree-dialog" aria-labelledby="tree-title">
  <div class="dialog-heading"><h2 id="tree-title"></h2><button type="button" class="button quiet close-button" id="close-tree" aria-label="关闭项目关系">×</button></div>
  <div class="toolbar tree-toolbar">
    <div class="toolbar-side"><button type="button" class="button secondary" id="new-child">新建子项目</button><button type="button" class="button secondary" id="tree-view-toggle">详细</button></div>
  </div>
  <div id="tree-board" class="tree-board"></div>
</dialog>

<dialog id="prompt-dialog" aria-labelledby="prompt-dialog-title">
  <div class="dialog-heading"><div><h2 id="prompt-dialog-title">项目提示词</h2><p id="prompt-dialog-project" class="dialog-meta"></p></div><button type="button" class="button quiet close-button" id="close-prompt" aria-label="关闭">×</button></div>
  <div id="prompt-editor" class="prompt-editor"></div>
</dialog>

<div id="project-menu" class="app-menu" role="menu" hidden></div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
